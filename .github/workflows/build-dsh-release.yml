# 自动检测 deepseek-ai/deepseek-harness 的新 release，构建对应版本的镜像并推送。
#
# 两种镜像并行维护（上游目前只发 rc/alpha pre-release，正式版以后可能出现）：
#   - stable：最新**正式** release（prerelease == false）。tag：`latest` + `<版本号>`。
#     上游还没有正式版时自动跳过，将来出现了会自动开始构建。
#   - rc    ：最新 release（无论正式/预发布）。tag：`rc` + `rc-<版本号>`。
#
# 版本状态判断：用 `docker buildx imagetools inspect` 查 GHCR 上是否已有同名
# tag（只读查询匿名可用，不依赖 package API 的额外 token）。
# 双架构：linux/amd64 + linux/arm64；node-pty 等原生模块在对应平台用镜像内的
# build-essential 现场编译，无需交叉工具链。
name: build-dsh-release

on:
  schedule:
    - cron: "23 */2 * * *" # 每 2 小时检查一次（错开整点，减轻上游 API 峰值）
  workflow_dispatch:
    inputs:
      version:
        description: "指定 dsh 版本号（如 0.2.2-rc.1），构建到 rc 系列 tag；留空 = 自动检测"
        required: false
        default: ""

permissions:
  contents: read
  packages: write

env:
  UPSTREAM_REPO: deepseek-ai/deepseek-harness
  IMAGE_NAME: deepseek-harness # 最终镜像 ghcr.io/<owner>/<repo>/deepseek-harness

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      stable_version: ${{ steps.pick.outputs.stable_version }}
      rc_version: ${{ steps.pick.outputs.rc_version }}
      stable_exists: ${{ steps.pick.outputs.stable_exists }}
      rc_exists: ${{ steps.pick.outputs.rc_exists }}
    steps:
      - name: Resolve target dsh versions
        id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          MANUAL_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          # release tag 形如 dsh-v0.2.2-rc.1 → 版本号 0.2.2-rc.1
          if [ -n "$MANUAL_VERSION" ]; then
            echo "stable_version=" >> "$GITHUB_OUTPUT"
            echo "rc_version=$MANUAL_VERSION" >> "$GITHUB_OUTPUT"
          else
            gh api "repos/${UPSTREAM_REPO}/releases?per_page=30" --paginate \
              --jq '.[] | [.tag_name, .prerelease] | @tsv' > /tmp/releases.tsv
            rc=$(head -n1 /tmp/releases.tsv | cut -f1 | sed 's/^dsh-v//')
            stable=$(awk -F'\t' '$2 == "false" {print $1; exit}' /tmp/releases.tsv \
                       | sed 's/^dsh-v//')
            echo "rc_version=$rc" >> "$GITHUB_OUTPUT"
            echo "stable_version=$stable" >> "$GITHUB_OUTPUT"
            echo "rc=$rc stable=${stable:-<none yet>}"
          fi
          check() { # $1 = version tag to look up → echoes true/false
            if docker buildx imagetools inspect \
                "ghcr.io/${GITHUB_REPOSITORY}/${IMAGE_NAME}:$1" >/dev/null 2>&1; then
              echo true
            else
              echo false
            fi
          }
          {
            rcv=$(sed -n 's/^rc_version=//p' "$GITHUB_OUTPUT")
            echo "rc_exists=$(if [ -n "$rcv" ]; then check "rc-$rcv"; else echo true; fi)"
          } >> "$GITHUB_OUTPUT"
          {
            stv=$(sed -n 's/^stable_version=//p' "$GITHUB_OUTPUT")
            echo "stable_exists=$(if [ -n "$stv" ]; then check "$stv"; else echo true; fi)"
          } >> "$GITHUB_OUTPUT"

  build-stable:
    needs: resolve
    if: needs.resolve.outputs.stable_exists == 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build and push (stable)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            DSH_VERSION=${{ needs.resolve.outputs.stable_version }}
          tags: |
            ghcr.io/${{ github.repository }}/${{ env.IMAGE_NAME }}:latest
            ghcr.io/${{ github.repository }}/${{ env.IMAGE_NAME }}:${{ needs.resolve.outputs.stable_version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-rc:
    needs: resolve
    if: needs.resolve.outputs.rc_exists == 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build and push (rc)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            DSH_VERSION=${{ needs.resolve.outputs.rc_version }}
          tags: |
            ghcr.io/${{ github.repository }}/${{ env.IMAGE_NAME }}:rc
            ghcr.io/${{ github.repository }}/${{ env.IMAGE_NAME }}:rc-${{ needs.resolve.outputs.rc_version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  summary:
    needs: [resolve, build-stable, build-rc]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Write summary
        env:
          R: ${{ github.repository }}
        run: |
          {
            echo "## dsh image build"
            echo "- stable: ${{ needs.resolve.outputs.stable_version || '（上游暂无正式版）' }} → ${{ needs.build-stable.result }}"
            echo "- rc: ${{ needs.resolve.outputs.rc_version }} → ${{ needs.build-rc.result }}"
            echo '```'
            echo "docker pull ghcr.io/${R}/${{ env.IMAGE_NAME }}:latest   # 正式版"
            echo "docker pull ghcr.io/${R}/${{ env.IMAGE_NAME }}:rc       # 最新 rc"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
